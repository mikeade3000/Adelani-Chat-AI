# LEGACY — the backend now runs on Cloudflare Workers (see README.md and worker/).
# Kept only in case you return to Render; "plan: free" avoids paid billing.
services:
  - type: web
    name: adelani-ai-backend
    plan: free
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      # Set these two in the Render dashboard — never commit their values.
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://mikeade3000.github.io/Adelani-Chat-AI
      - key: BACKEND_URL
        value: https://adelani-ai-backend.onrender.com
