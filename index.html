<script>
(function(){
  /* Block right-click */
  document.addEventListener('contextmenu',function(e){e.preventDefault();});

  document.addEventListener('keydown',function(e){
    var k=e.key||'',c=e.ctrlKey||e.metaKey,s=e.shiftKey;

    /* Block F12 */
    if(k==='F12'){e.preventDefault();e.stopPropagation();return false;}

    /* Block DevTools shortcuts: Ctrl+Shift+I/J/K/E (NOT C — allow copy) */
    if(c&&s&&/^[ijke]$/i.test(k)){e.preventDefault();return false;}

    /* Block Ctrl+U (view source), Ctrl+S (save), Ctrl+P (print) */
    if(c&&/^[usp]$/i.test(k)){e.preventDefault();return false;}

    /* Ctrl+C is ALLOWED — users need to copy AI responses */
    /* Ctrl+V (paste) is ALLOWED — users need to paste in input */
    /* Ctrl+A is ALLOWED inside textarea/input only */
    if(c&&k.toLowerCase()==='a'){
      var tag=(document.activeElement||{}).tagName;
      if(tag!=='INPUT'&&tag!=='TEXTAREA'){e.preventDefault();return false;}
    }
  },true);

  /* Allow text selection on AI response bubbles */
})();
</script>

<script>
(function(){
  function showError(title, detail){
    var r = document.getElementById("root");
    if(!r || r.getAttribute("data-mounted")==="1") return;
    r.innerHTML =
      '<div style="max-width:560px;margin:60px auto;padding:24px;font-family:Times New Roman,serif;'
      + 'background:#FBF8F1;border:1px solid #E2D9CA;border-radius:12px;color:#1A1208;line-height:1.55">'
      + '<div style="font-size:22px;font-weight:700;margin-bottom:8px">Adelani AI — startup problem</div>'
      + '<div style="color:#7A7070;margin-bottom:14px">'+title+'</div>'
      + '<pre style="white-space:pre-wrap;background:#EDE8DF;padding:12px;border-radius:8px;font-size:12.5px;'
      + 'font-family:monospace;color:#6b1a1a;overflow:auto;max-height:200px">'+(detail||"")+'</pre>'
      + '<div style="margin-top:14px;font-size:13.5px;color:#7A7070">Try a hard refresh (Ctrl+Shift+R). '
      + 'If it persists, the details above pinpoint the cause.</div></div>';
  }
  // Catch any script/runtime error during startup
  window.addEventListener("error", function(e){
    showError("A script failed to load or run.", (e.message||"")+"\n"+(e.filename||""));
  }, true);
  window.addEventListener("unhandledrejection", function(e){
    showError("A background task failed.", (e.reason && (e.reason.stack||e.reason.message)) || String(e.reason));
  });
  // Watchdog: if React hasn't mounted in 8s, a vendor script probably failed
  window.__adelaniWatchdog = setTimeout(function(){
    var r = document.getElementById("root");
    if(r && r.getAttribute("data-mounted")!=="1"){
      var babelMissing = !!window.__adelaniNeedsBabel && (typeof Babel === "undefined");
      var reactMissing = (typeof React === "undefined");
      showError(
        "The app did not start within 8 seconds.",
        (reactMissing ? "• React failed to load from ./vendor/react.production.min.js.\n" : "")
        + (babelMissing ? "• Babel failed to load from ./vendor/babel.min.js.\n" : "")
        + (!babelMissing && !reactMissing ? "• Libraries loaded, but the app code did not run.\nOpen the browser console for the exact line." : "")
        + "\nCheck that the vendor/ folder was deployed alongside index.html."
      );
    }
  }, 8000);
})();
</script>

/* ══════════ REVIEW ARTICLE ENGINE ══════════ */
const REVIEW_ENGINE_SYS = `You are a senior academic author and peer reviewer with deep expertise in ‹FIELD/DISCIPLINE› and a record of publishing ‹REVIEW_TYPE› review articles in indexed, peer-reviewed journals. Write a complete, submission-ready review article on ‹TOPIC› for ‹TARGET_JOURNAL›, obeying every directive below.

STRUCTURE (in order): 1) Title (<=15 words, no full stop). 2) Abstract — ‹ABSTRACT_TYPE›, 200–300 words, no citations. 3) Keywords — ‹KEYWORDS›, alphabetized. 4) Introduction — context, gap, rationale, explicit aim, scope. 5) Methods / Review Strategy scaled to ‹REVIEW_TYPE› (for systematic/scoping include databases, search string, date range, inclusion/exclusion criteria and ‹SPECIAL_REQUIREMENTS›). 6) Thematic Body — 3–6 sections that synthesize and compare across studies. 7) Discussion / Synthesis. 8) Limitations. 9) Future Directions / Implications. 10) Conclusion (no new citations). 11) Declarations (funding, conflicts, contributions, data availability, ethics). 12) References in APA 7th.

CITATIONS (APA 7th, strict): about ‹TOTAL_REFERENCES› references, recent where possible. In-text author–date; et al. for 3+ authors. Reference list alphabetical, hanging indent, sentence-case titles, italicized journal names and volume. Every reference ends in a resolvable https://doi.org/10.xxxx/xxxxx link, or a stable URL where no DOI exists. NEVER fabricate or pattern-generate a DOI — if you cannot confirm one, append [VERIFY DOI] and leave it blank. At least ‹TARGET_JOURNAL_CITE_%›% of references must come from ‹TARGET_JOURNAL› itself, each genuinely relevant and naturally distributed, never padded; if too few relevant works exist, flag the shortfall. One-to-one match between in-text citations and the reference list.

STYLE: apply ‹SPELLING_CONVENTION› uniformly everywhere. Define each abbreviation once. Vary sentence structure; do NOT repeat words/phrases in close proximity; avoid AI crutch phrases (delve, moreover/furthermore overuse, "it is important to note", "plays a crucial role", "tapestry"). No padding; each paragraph advances a distinct point. Active, precise verbs; measured scholarly tone.

TABLES & FIGURES: include ‹NUM_TABLES› tables and ‹NUM_FIGURES› figures, each informative. Number sequentially; table captions above, figure captions below; label all axes/columns/units; call out each exhibit in the text before it appears. Render tables in Markdown; for each figure give a caption, a description, and a labeled data table or plotting spec. Do not present fabricated data as real measurements.

INTEGRITY: original synthesis only; paraphrase; short quoted+cited direct quotes only. Match the journal's aims and scope. AUDIENCE: ‹AUDIENCE›. TARGET LENGTH: ‹WORD_COUNT› (excluding references). End with a brief Submission Notes block listing any [VERIFY DOI] items and the final word and reference counts.`;

function buildReviewSystem(cfg, mode){
  const map = {
    "‹FIELD/DISCIPLINE›": cfg.field||"the relevant discipline",
    "‹REVIEW_TYPE›": cfg.reviewType||"Narrative",
    "‹TOPIC›": cfg.topic,
    "‹TARGET_JOURNAL›": cfg.journal,
    "‹ABSTRACT_TYPE›": cfg.abstractType||"Structured",
    "‹KEYWORDS›": cfg.keywords||"generate 4–6 keywords",
    "‹SPECIAL_REQUIREMENTS›": cfg.special||"the standard reporting checklist",
    "‹TOTAL_REFERENCES›": cfg.totalRefs||"40–60",
    "‹TARGET_JOURNAL_CITE_%›": cfg.citePct||"50",
    "‹SPELLING_CONVENTION›": cfg.spelling||"British English",
    "‹NUM_TABLES›": mode==="preview"?"0":(cfg.numTables||"3"),
    "‹NUM_FIGURES›": mode==="preview"?"0":(cfg.numFigures||"3"),
    "‹AUDIENCE›": cfg.audience||"scholars",
    "‹WORD_COUNT›": mode==="preview"?"about 700 words (PREVIEW ONLY)":(cfg.wordCount||"6,000–8,000")
  };
  let s = REVIEW_ENGINE_SYS;
  for(const k in map){ s = s.split(k).join(map[k]); }
  if(mode==="preview"){
    s += "\n\nFREE PREVIEW MODE (strict): produce ONLY the Title, Abstract, Keywords, a short bulleted outline naming the remaining sections, and the Introduction. Keep the whole output under ~700 words. Do NOT write the methods, body, discussion, limitations, tables, figures, or reference list. End with exactly: '— Preview ends here. Register or log in to generate the full article: all sections, tables, figures, and the complete APA 7th reference list with DOIs.'";
  } else {
    s += "\n\nFULL MODE: produce the complete article. If a single response is cut off by length, stop cleanly at a section boundary so it can be continued on request.";
  }
  return s;
}

/* Ask the backend for a reply. With onDelta, the answer streams in word by word
   (onDelta gets the text so far); without it, the full reply is returned at once.
   Falls back to a normal JSON reply if the server doesn't stream. */
async function streamChat(payload,onDelta){
  const r=await fetch(BACKEND+"/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...payload,stream:!!onDelta})});
  const ctype=r.headers.get("Content-Type")||"";
  if(!onDelta||!ctype.includes("text/event-stream")||!r.body){
    const d=await r.json().catch(()=>({error:"Server error (HTTP "+r.status+")."}));
    return d.reply||(d.error?"⚠️ "+d.error:"No response.");
  }
  const reader=r.body.getReader(),dec=new TextDecoder();
  let buf="",text="",last=0;
  for(;;){
    const {done,value}=await reader.read();
    if(done)break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split("\n");buf=lines.pop();
    for(const line of lines){
      if(!line.startsWith("data: "))continue;           // skips ": OPENROUTER PROCESSING" keep-alives
      const data=line.slice(6).trim();
      if(data==="[DONE]")continue;
      try{
        const j=JSON.parse(data);
        if(j.error){text+=(text?"\n\n":"")+"⚠️ "+(j.error.message||"The model stopped unexpectedly.");continue;}
        text+=j.choices?.[0]?.delta?.content||"";
      }catch{}
    }
    const now=Date.now();
    if(now-last>60){last=now;onDelta(text);}           // ~16 screen updates/sec is plenty
  }
  onDelta(text);
  return text||"No response generated.";
}

/* Only the recent conversation goes to the AI — fewer tokens means faster, cheaper
   answers. Images are kept only for the latest messages; older ones become a note. */
const MAX_HISTORY=12, MAX_CHARS_PER_MSG=12000;
function trimHistory(msgs){
  const recent=msgs.slice(-MAX_HISTORY);
  return recent.map((m,i)=>{
    const content=(m.content||"").length>MAX_CHARS_PER_MSG&&i<recent.length-1
      ? m.content.slice(0,MAX_CHARS_PER_MSG)+"\n…[earlier text shortened]"
      : (m.content||"");
    if(m.image&&i>=recent.length-2){
      return{role:m.role,content:[
        {type:"text",text:content||"Describe this image."},
        {type:"image_url",image_url:{url:"data:image/jpeg;base64,"+m.image,detail:"high"}}
      ]};
    }
    return{role:m.role,content:m.image?content+"\n[an image was shared earlier]":content};
  });
}

async function chatRequest(payload,onDelta){
  const MAX_WAIT=90000, RETRY_GAP=4000, started=Date.now();
  let reply=null;
  while(Date.now()-started<MAX_WAIT){
    try{ reply=await streamChat(payload,onDelta); break; }
    catch(e){
      if(Date.now()-started+RETRY_GAP<MAX_WAIT) await new Promise(rs=>setTimeout(rs,RETRY_GAP));
      else break;
    }
  }
  return reply||"⚠️ Service temporarily unavailable. Please check your connection and try again.";
}

function loadScript(url){
  return new Promise((res,rej)=>{
    if(document.querySelector(`script[src="${url}"]`)){res();return;}
    const s=document.createElement("script");
    s.src=url;s.onload=res;s.onerror=rej;
    document.head.appendChild(s);
  });
}
const toBase64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(f);});
const readText=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsText(f);});
const readAB  =f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsArrayBuffer(f);});
const fmtSize =b=>b<1024?b+"B":b<1048576?(b/1024).toFixed(1)+"KB":(b/1048576).toFixed(1)+"MB";

async function extractPDF(file){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
  window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const ab=await readAB(file);
  const pdf=await pdfjsLib.getDocument({data:ab}).promise;
  let text=`[PDF — ${pdf.numPages} page${pdf.numPages>1?"s":""}]\n\n`;
  const pages=Math.min(pdf.numPages,25);
  for(let i=1;i<=pages;i++){
    const page=await pdf.getPage(i);
    const c=await page.getTextContent();
    text+=`--- Page ${i} ---\n`+c.items.map(s=>s.str).join(" ")+"\n\n";
  }
  if(pdf.numPages>25) text+=`\n[Showing first 25 of ${pdf.numPages} pages]`;
  return text.trim()||"[No extractable text found — PDF may be image-based/scanned]";
}

async function extractDOCX(file){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
  const ab=await readAB(file);
  const r=await mammoth.extractRawText({arrayBuffer:ab});
  return r.value||"[No text extracted from document]";
}

async function extractExcel(file){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
  const ab=await readAB(file);
  const wb=XLSX.read(ab,{type:"array"});
  let text="";
  wb.SheetNames.forEach(name=>{
    text+=`\n=== Sheet: ${name} ===\n`;
    text+=XLSX.utils.sheet_to_csv(wb.Sheets[name]);
  });
  return text.trim()||"[Empty spreadsheet]";
}

async function extractPPTX(file){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
  const ab=await readAB(file);
  const zip=await JSZip.loadAsync(ab);
  const slides=Object.keys(zip.files).filter(n=>/ppt\/slides\/slide\d+\.xml/.test(n)).sort((a,b)=>{
    const na=parseInt(a.match(/slide(\d+)/)?.[1]||0);
    const nb=parseInt(b.match(/slide(\d+)/)?.[1]||0);
    return na-nb;
  });
  let text=`[PowerPoint — ${slides.length} slide${slides.length!==1?"s":""}]\n\n`;
  for(const sf of slides.slice(0,40)){
    const xml=await zip.files[sf].async("string");
    const t=xml.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
    const n=sf.match(/slide(\d+)/)?.[1];
    if(t) text+=`--- Slide ${n} ---\n${t}\n\n`;
  }
  return text.trim()||"[No text found in presentation]";
}

async function extractODT(file){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
  const ab=await readAB(file);
  const zip=await JSZip.loadAsync(ab);
  if(!zip.files["content.xml"]) return "[Could not read ODT content]";
  const xml=await zip.files["content.xml"].async("string");
  return xml.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
}

async function processFile(file){
  const ext=file.name.split(".").pop().toLowerCase();
  const name=file.name;
  const size=fmtSize(file.size);
  const icon=FILE_ICONS[ext]||"📎";

  try{
    /* ── Images → vision model ── */
    if(IMG_EXT.includes(ext)){
      const data=await toBase64(file);
      return{type:"image",data,name,ext,icon,size};
    }
    /* ── SVG → treat as text ── */
    if(ext==="svg"){
      const content=await readText(file);
      return{type:"document",content:`SVG file "${name}":\n\n${content.slice(0,12000)}`,name,ext,icon,size};
    }
    /* ── Plain text ── */
    if(ext==="txt"){
      const content=await readText(file);
      return{type:"document",content:`Text file "${name}":\n\n${content.slice(0,12000)}`,name,ext,icon,size};
    }
    /* ── CSV ── */
    if(ext==="csv"){
      const content=await readText(file);
      return{type:"document",content:`CSV data from "${name}":\n\n${content.slice(0,12000)}`,name,ext,icon,size};
    }
    /* ── PDF ── */
    if(ext==="pdf"){
      const content=await extractPDF(file);
      return{type:"document",content:`PDF document "${name}":\n\n${content.slice(0,12000)}`,name,ext,icon,size};
    }
    /* ── DOCX ── */
    if(ext==="docx"){
      const content=await extractDOCX(file);
      return{type:"document",content:`Word document "${name}":\n\n${content.slice(0,12000)}`,name,ext,icon,size};
    }
    /* ── DOC (legacy) ── */
    if(ext==="doc"){
      try{
        const content=await extractDOCX(file);
        return{type:"document",content:`Word document "${name}":\n\n${content.slice(0,12000)}`,name,ext,icon,size};
      }catch{
        return{type:"unsupported",name,ext,icon,size,reason:"Old .doc format could not be read. Please save as .docx and try again."};
      }
    }
    /* ── Excel ── */
    if(["xlsx","xls"].includes(ext)){
      const content=await extractExcel(file);
      return{type:"document",content:`Spreadsheet "${name}":\n\n${content.slice(0,12000)}`,name,ext,icon,size};
    }
    /* ── PowerPoint ── */
    if(ext==="pptx"){
      const content=await extractPPTX(file);
      return{type:"document",content:`PowerPoint "${name}":\n\n${content.slice(0,12000)}`,name,ext,icon,size};
    }
    /* ── PPT (legacy) ── */
    if(ext==="ppt"){
      return{type:"unsupported",name,ext,icon,size,reason:"Old .ppt format cannot be read. Please save as .pptx and try again."};
    }
    /* ── ODT ── */
    if(ext==="odt"){
      const content=await extractODT(file);
      return{type:"document",content:`ODT document "${name}":\n\n${content.slice(0,12000)}`,name,ext,icon,size};
    }
    /* ── Audio ── */
    if(AUDIO_EXT.includes(ext)){
      return{type:"unsupported",name,ext,icon,size,reason:`Audio files (.${ext}) cannot be transcribed yet. This feature is coming soon.`};
    }
    /* ── Video ── */
    if(VIDEO_EXT.includes(ext)){
      return{type:"unsupported",name,ext,icon,size,reason:`Video files (.${ext}) cannot be analysed yet. This feature is coming soon.`};
    }
    /* ── Archives ── */
    if(ARCHIVE_EXT.includes(ext)){
      return{type:"unsupported",name,ext,icon,size,reason:`Archive files (.${ext}) cannot be extracted in the browser.`};
    }
    /* ── Executable ── */
    if(ext==="exe"){
      return{type:"unsupported",name,ext,icon,size,reason:"Executable files (.exe) cannot be analysed for security reasons."};
    }
    return{type:"unsupported",name,ext,icon,size,reason:`Unsupported file type: .${ext}`};
  }catch(err){
    return{type:"error",name,ext,icon,size,reason:`Could not read file: ${err.message}`};
  }
}

function pollImageURL(prompt,w,h){

async function fetchImageObjectURL(url){
  try{const r=await fetch(url,{mode:"cors"});if(!r.ok)throw 0;const b=await r.blob();return URL.createObjectURL(b);}catch{return url;}
}
/* Fetch an image and return a base64 data URL (needed to EMBED images inside the .pptx). */
async function fetchImageDataURL(url){
  const r=await fetch(url,{mode:"cors"});
  if(!r.ok) throw new Error("image fetch failed");
  const b=await r.blob();
  return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b);});
}
function parseDesignJSON(raw){
  let s=(raw||"").trim().replace(/^```(json)?/i,"").replace(/```$/,"").trim();
  const a=s.indexOf("{"), b=s.lastIndexOf("}");
  if(a>=0&&b>a) s=s.slice(a,b+1);
  return JSON.parse(s);
}

/* ══════════ MARKDOWN ══════════ */
function md(raw,accent,dark){
  const cc=dark?"rgba(255,255,255,.08)":"rgba(90,60,20,.07)";
  const pc=dark?"#14110D":"#F4EEE2";
  const NL="\u0000"; // keeps line breaks inside code blocks out of the paragraph logic below
  let t=raw.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  t=t.replace(/```[\w]*\n?([\s\S]*?)```/g,(m,code)=>`<pre style="background:${pc};border:1px solid ${dark?"#2F2920":"#E3D7C1"}"><code>${code.replace(/\n/g,NL)}</code></pre>`);
  t=t.replace(/`([^`\n]+)`/g,`<code style="background:${cc}">$1</code>`);
  t=t.replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>");
  t=t.replace(/\*([^*\n]+)\*/g,"<em>$1</em>");
  t=t.replace(/^\s*(?:---+|\*\*\*+|___+)\s*$/gm,'<div class="rule"></div>');
  t=t.replace(/^### (.+)$/gm,'<div class="h3">$1</div>');
  t=t.replace(/^## (.+)$/gm,'<div class="h2">$1</div>');
  t=t.replace(/^# (.+)$/gm,'<div class="h1">$1</div>');
  t=t.replace(/^\s*(\d+)\.\s(.+)$/gm,(m,n,p)=>`<div class="li"><span style="color:${accent};font-weight:700;flex-shrink:0;min-width:22px;font-variant-numeric:oldstyle-nums">${n}.</span><span>${p}</span></div>`);
  t=t.replace(/^\s*[-*•]\s(.+)$/gm,`<div class="li"><span style="color:${accent};flex-shrink:0">❧</span><span>$1</span></div>`);
  t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,`<a href="$2" target="_blank" rel="noopener noreferrer" style="color:${accent};text-decoration:underline">$1</a>`);
  // Line breaks: block elements already start on their own line, so drop the
  // newline right before/after them; a blank line elsewhere becomes a small gap.
  t=t.replace(/(<\/div>|<\/pre>)\n/g,"$1");
  t=t.replace(/\n(<div class=|<pre)/g,"$1");
  t=t.replace(/\n{2,}/g,'<div class="gap"></div>');
  t=t.replace(/\n/g,"<br/>");
  return t.split(NL).join("\n");
}

/* ══════════ SAVE A GENERATED FILE ══════════
   Downloads in place (no new tab, which made phones ignore the file name).
   Returns false if the file is gone — files live only until the page is reloaded. */
const MIME_EXT={"image/jpeg":".jpg","image/png":".png","image/webp":".webp"};
async function saveFile(url,filename){
  if(!url) return false;
  if(!url.startsWith("blob:")){ window.open(url,"_blank","noopener"); return true; } // remote image fallback
  let blob;
  try{ blob=await (await fetch(url)).blob(); }catch{ return false; }
  let name=filename||"download";
  const ext=MIME_EXT[blob.type];
  if(ext&&!name.toLowerCase().endsWith(ext)) name=name.replace(/\.[a-z0-9]+$/i,"")+ext;
  const href=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=href;a.download=name;a.rel="noopener";a.style.display="none";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(href),60000);
  return true;
}

function SaveButton({url,filename}){
  const [state,setState]=useState("idle"); // idle | saving | gone
  const click=async()=>{
    setState("saving");
    const ok=await saveFile(url,filename);
    setState(ok?"idle":"gone");
  };
  return(
    <button onClick={click} disabled={state==="gone"} title={state==="gone"?"This file was cleared when the page reloaded. Ask Grace to make it again.":"Save to your device"}
      style={{height:34,padding:"0 14px",borderRadius:6,background:state==="gone"?"transparent":"linear-gradient(135deg,#7A2232,#561520)",border:state==="gone"?"1px solid #C9BBA3":"1px solid #B08D3C",color:state==="gone"?"#9A8C76":"#FFFBF2",fontSize:13.5,fontWeight:600,fontFamily:SERIF,cursor:state==="gone"?"default":"pointer",whiteSpace:"nowrap"}}>
      {state==="gone"?"Expired — ask again":state==="saving"?"Saving…":"⬇ Save"}
    </button>
  );
}

/* ══════════ 3D EMBLEM ══════════
   A gold-rimmed coin. mode: "flip" turns all the way round (back shows `back`),
   "sway" rocks in 3D, "spin" spins fast (used while thinking), "still" is a static
   3D coin. Hover makes any coin spin. Respects the "reduce motion" setting. */
function Emblem({icon,back,color,size=34,mode="sway",delay=0,ring=0,ringBg,float,letter}){
  const depth=Math.max(2,Math.round(size/14));     // coin thickness in px
  const layers=[];
  for(let i=0;i<=depth*2;i++) layers.push(<div key={i} className="emb-edge" style={{transform:`translateZ(${(i-depth)/2}px)`}}/>);
  const glyph=(g,isLetter)=><span className={"emb-glyph"+(isLetter?" emb-letter":"")} style={{fontSize:isLetter?size*0.56:size*0.42}}>{g}</span>;
  return(
    <div className={`emb emb-${mode}${ring?" emb-ring":""}${float?" emb-float":""}`}
      style={{width:size,height:size,"--c":color,"--d":`${delay}s`,"--rg":`${ring}px`,"--bgc":ringBg||"transparent"}}>
      <div className="emb-coin">
        {layers}
        <div className="emb-face" style={{transform:`translateZ(${depth/2+0.5}px)`}}>{glyph(icon,letter)}</div>
        <div className="emb-face" style={{transform:`rotateY(180deg) translateZ(${depth/2+0.5}px)`}}>{glyph(back||icon,true)}</div>
      </div>
    </div>
  );
}

  const t=TH[theme];const dark=theme==="dark";const msgs=convs[agent.id]||[];

  useEffect(()=>{const fn=()=>setMobile(window.innerWidth<720);window.addEventListener("resize",fn);return()=>window.removeEventListener("resize",fn);},[]);
  useEffect(()=>{

    if(ses&&ses.expiresAt>Date.now()){setUser(ses);setView("chat");}
    else setView("auth");

  useEffect(()=>{if(!msgs.length||busy)return;const k=user?`adl-m-${user.id}-${agent.id}`:`adl-gm-${agent.id}`;ls.set(k,msgs.slice(-80));},[msgs,busy,agent.id,user?.id]);
  useEffect(()=>{botRef.current?.scrollIntoView({behavior:busy?"auto":"smooth"});},[msgs,busy]);

  useEffect(()=>{ if(!agent.design) return; (async()=>{ const q=await fetchDeckQuota(ls.get("adl-ses")||{}); if(q) setDecksLeft(q.unlimited?null:q.decksLeft); })(); },[agent.id,user?.id]);
  const toggleTheme=()=>{const n=dark?"light":"dark";setTheme(n);ls.set("adl-theme",n);};
  const showT=m=>{setToast(m);setTimeout(()=>setToast(""),2800);};

  const switchAgent=a=>{setAgent(a);if(mobile)setSide(false);};

  /* ── File handler ── */
  const handleFile=async(e)=>{
    const f=e.target.files[0];if(!f)return;

    setProcessing(false);

      showT(result.reason);
      return;
    }
    setAttachment(result);

  /* ── SEND ── */
  /* ── STUDIO DESIGN GENERATION ── */
  const handleDesign=useCallback(async(text,att)=>{
    let source="";
    if(att?.type==="document") source="\n\nSOURCE MATERIAL (from uploaded "+(att.ext||"file")+"):\n"+att.content;
    else if(att?.type==="image") source="\n\n(The user attached an image named "+(att.name||"image")+" as reference.)";
    const userText=text||(att?("Design something based on the uploaded "+(att.ext||"file")+"."):"");

    const um={role:"user",timestamp:new Date().toISOString(),content:userText||"(design request)",
      fileName:att?.name||null,fileIcon:att?.icon||null,fileExt:att?.ext||null,fileSize:att?.size||null,
      image:att?.type==="image"?att.data:null};
    const hist=[...msgs,um];
    setConvs(p=>({...p,[agent.id]:hist}));
    setInput("");setAttachment(null);setBusy(true);
    if(taRef.current)taRef.current.style.height="auto";
    if(user?.role!=="admin")bumpUsage();

    const push=(content,design)=>setConvs(p=>({...p,[agent.id]:[...hist,{role:"assistant",content,design,timestamp:new Date().toISOString()}]}));
    push("🎨 Designing… this can take a moment.",null);

    const SYS=`You are Grace, the lead designer at Adelani AI's presentation studio. You produce decks that look like they came from a top consulting firm or design agency: a clear storyline, sharp copy, striking visuals and real data. Decide whether the user wants a PRESENTATION or a GRAPHIC/IMAGE, then reply with ONLY valid JSON — no markdown, no backticks, no commentary.

CONTEXT — use these facts, never invent other meanings:
• Adelani AI Chat (mikeade3000.github.io/Adelani-Chat-AI) is a multi-agent AI assistant by Dr. Michael Adelani Adewusi.
• Its 7 agents: Asha, Scholar, Bizna, Dawa, Ubuntu, Nexus, and Grace (design). "Grace" ALWAYS means this design agent — NEVER a religious concept.

HOW TO DESIGN AN OUTSTANDING DECK
• Storyline: cover → agenda → sections that build an argument → evidence (stats, chart, timeline) → recommendation → closing. Default 10–12 slides unless the user gives a number (then EXACTLY that many).
• Copy: titles are short insights (≤7 words), not labels — "Mobile money tripled since 2020", not "Mobile money". Card text ≤16 words. Concrete facts, numbers and examples; no filler.
• Variety: never use the same layout twice in a row. Use at least 6 different layouts. Include a "chart" or "stat" slide when the topic has numbers (use realistic, clearly approximate figures and add "source" when known).
• Visuals: give the cover, every section and the closing an "image" — a vivid photo description of a real scene that fits the topic (e.g. "Nigerian farmer inspecting maize at sunrise, wide shot"). Use one or two "image" split slides. Never ask for text inside images.
• Icons: give every features/grid item a fitting emoji icon (🚀 🎯 💡 🔒 📊 🌍 ⚡ ✅ 🏥 🎓 💰 🌱).
• Speaker notes: EVERY slide gets "notes" — 2–4 natural sentences the presenter can say.
• Theme: pick the theme that fits the topic and audience (or follow the user's colours/fonts exactly).

OBEY EXPLICIT INSTRUCTIONS EXACTLY: slide count, theme/colours, fonts, section order, presenter name, date. Never prefix titles with "Slide 1:".

DECK JSON:
{"type":"deck","title":"...","kicker":"short tag","theme":"adelani","presenter":"optional","date":"optional","filename":"optional","slides":[ ... ]}

THEMES: "adelani" (burgundy & gold, classic), "executive" (navy & gold, corporate), "aurora" (indigo/violet/cyan, modern tech), "obsidian" (black & gold, luxury, dark), "savanna" (terracotta & amber, African, warm), "ocean" (deep blue & teal, fresh), "forest" (green & gold, nature/agriculture/health), "royal" (purple & gold, elegant, dark), "coral" (rose & navy, energetic), "minimal" (black/white/blue, clean). Custom: {"primary":"HEX","accent":"HEX","c1":"HEX","c2":"HEX","font":"Georgia"} (c1/c2 = cover gradient).

LAYOUTS (every slide may also have "notes"):
• {"layout":"title","title":"...","subtitle":"...","kicker":"...","presenter":"...","date":"...","image":"photo description"}
• {"layout":"agenda","title":"Agenda","items":[{"title":"...","text":"optional"}, ...3-6]}

• {"layout":"chart","title":"...","chart":{"type":"bar|line|pie|doughnut","labels":["2021","2022"],"series":[{"name":"...","values":[10,20]}]},"insights":["...", ...2-3],"source":"optional"}
• {"layout":"comparison","title":"...","left":{"title":"...","points":["..."]},"right":{"title":"...","points":["..."]}}
• {"layout":"matrix","title":"SWOT analysis","items":[{"title":"Strengths","points":["..."]},{"title":"Weaknesses","points":["..."]},{"title":"Opportunities","points":["..."]},{"title":"Threats","points":["..."]}]}
• {"layout":"image","title":"...","bullets":["..."],"image":"photo description","side":"right|left"}
• {"layout":"quote","quote":"...","attribution":"...","image":"photo description"}
• {"layout":"table","title":"...","table":[["Header","Header"],["cell","cell"]]}
• {"layout":"content","title":"...","bullets":["..."]}   // use rarely
• {"layout":"closing","title":"Thank you","subtitle":"call to action","contact":"optional","image":"photo description"}

GRAPHIC JSON: {"type":"image","prompt":"rich detailed prompt","width":1024,"height":1024,"caption":"..."}

If source material is provided, build the deck from it. Output JSON only.`;

    const ses=ls.get("adl-ses")||{};
    const d=await designRequest({messages:[{role:"user",content:userText+source}],systemPrompt:SYS,maxTokens:4500,model:GRACE_MODEL,username:ses.username||null,sessionToken:ses.sessionToken||null});
    if(typeof d.decksLeft==="number") setDecksLeft(d.decksLeft);

      push("🔒 "+(d.error||"You've used your free presentations for today.")+"\n\nGraphics are still available, and your limit resets tomorrow.",null);
      setShowDeckLimit(true); setBusy(false); return;
    }
    const reply=d.reply||(d.error?"⚠️ "+d.error:"");

    let spec=null;
    try{ spec=parseDesignJSON(reply); }catch(e){ spec=null; }
    if(!spec||!spec.type){
      push(reply&&/^⚠️/.test(reply)?reply:"⚠️ I couldn't structure that design. Try describing it differently — e.g. \"Make a 10-slide deck on climate-smart agriculture\" or \"Design a poster for our graduation event\".",null);
      setBusy(false); return;
    }
    try{
      if(spec.type==="deck"){
        const res=await buildDeck(spec,msg=>push("🎨 "+msg,null));
        const left=typeof d.decksLeft==="number"?d.decksLeft:null;
        const note=left===null?"":(left>0?`\n\n*${left} of ${FREE_DECKS} free presentations left today.*`:`\n\n*That was your last free presentation today — Premium gives you unlimited.*`);
        push("✅ **\""+(spec.title||"Untitled")+"\"** is ready — "+res.count+" slides in the "+res.theme+" theme, with speaker notes. Tap **Save** to download your PowerPoint."+note,{kind:"pptx",url:res.url,filename:res.filename,preview:res.preview});

        const gen=pollImageURL(spec.prompt,spec.width,spec.height);

        push((spec.caption?("🎨 "+spec.caption):"🎨 Here's your graphic.")+" — tap Save to download.",{kind:"image",url:preview,filename:((spec.caption||"graphic").replace(/[^\w\s-]/g,"").trim().replace(/\s+/g,"-").slice(0,40)||"graphic")+".png",preview});
      } else {
        push("⚠️ Unsupported design type. Ask for a presentation or a graphic.",null);
      }
    }catch(e){
      push("⚠️ Something went wrong building the file: "+(e?.message||e)+". Please try again.",null);
    }
    setBusy(false);
  },[msgs,agent,user]);

  const send=useCallback(async()=>{
    const text=(input||"").trim();
    if(!text&&!attachment)return;
    if(busy)return;
    if(user?.role!=="admin"&&limitHit()){setShowLimit(true);return;}

    /* Studio design agent uses its own generation flow */
    if(agent.design){ await handleDesign(text,attachment); return; }

    /* Build user message */
    const msgMeta={
      role:"user",
      timestamp:new Date().toISOString(),
      fileName:attachment?.name||null,
      fileIcon:attachment?.icon||null,
      fileExt:attachment?.ext||null,
      fileSize:attachment?.size||null,
    };

    let msgContent=text;
    let msgImage=null;

    if(attachment?.type==="image"){
      msgImage=attachment.data;
      msgContent=text||"Please analyse this image in detail.";
    } else if(attachment?.type==="document"){
      // Prepend file content to message
      msgContent=attachment.content+"\n\n"+(text||"Please analyse and summarise the above document.");
    }

    const um={...msgMeta,content:msgContent,image:msgImage};
    const hist=[...msgs,um];
    setConvs(p=>({...p,[agent.id]:hist}));
    setInput("");setAttachment(null);setBusy(true);
    if(taRef.current)taRef.current.style.height="auto";
    if(user?.role!=="admin")bumpUsage();

    /* Build API messages — recent history only, for speed */
    const apiMessages=trimHistory(hist);

    const ses=ls.get("adl-ses")||{};
    const payload={
      messages:apiMessages,
      systemPrompt:agent.system,
      hasImage:apiMessages.some(m=>Array.isArray(m.content)),
      username:ses.username||null,
      sessionToken:ses.sessionToken||null
    };

    /* Stream the answer in as it is written */
    const ts=new Date().toISOString();
    const reply=await chatRequest(payload,partial=>{
      setConvs(p=>({...p,[agent.id]:[...hist,{role:"assistant",content:partial,timestamp:ts}]}));
    });

    setConvs(p=>({...p,[agent.id]:[
      ...hist,
      {role:"assistant",content:reply,timestamp:ts}
    ]}));
    setBusy(false);
  },[input,attachment,busy,msgs,agent,user]);

  /* ── REVIEW ARTICLE GENERATION ── */
  const genReview=useCallback(async(cfg)=>{
    setShowReview(false);
    if(user?.role!=="admin"&&limitHit()){setShowLimit(true);return;}
    const sch=AGENTS.find(a=>a.id==="scholar");
    const isReg=!!user&&!isGuest;
    setLastReviewCfg(isReg?cfg:null);
    setAgent(sch);
    const key=user?`adl-m-${user.id}-scholar`:`adl-gm-scholar`;
    const base=ls.get(key)||[];
    const cmd=`Generate a ${cfg.reviewType} review article on "${cfg.topic}" for the journal "${cfg.journal}". Follow the system instructions exactly.`;
    const hist=[...base,{role:"user",content:"📝 "+cmd,timestamp:new Date().toISOString()}];
    ls.set(key,hist.slice(-80));
    setConvs(p=>({...p,scholar:hist}));
    setBusy(true);
    if(user?.role!=="admin")bumpUsage();
    const ses=ls.get("adl-ses")||{};
    const sys=buildReviewSystem(cfg,isReg?"full":"preview");
    const ts=new Date().toISOString();
    const reply=await chatRequest({messages:[{role:"user",content:cmd}],systemPrompt:sys,maxTokens:isReg?3500:900,model:isReg?HEAVY_MODEL:undefined,username:ses.username||null,sessionToken:ses.sessionToken||null},
      partial=>setConvs(p=>({...p,scholar:[...hist,{role:"assistant",content:partial,timestamp:ts}]})));
    const fin=[...hist,{role:"assistant",content:reply,timestamp:new Date().toISOString()}];
    ls.set(key,fin.slice(-80));
    setConvs(p=>({...p,scholar:fin}));
    setBusy(false);
  },[user,isGuest]);

  const continueReview=useCallback(async()=>{
    if(!lastReviewCfg)return;
    if(user?.role!=="admin"&&limitHit()){setShowLimit(true);return;}
    const key=user?`adl-m-${user.id}-scholar`:`adl-gm-scholar`;
    const base=ls.get(key)||[];
    const apiMsgs=base.slice(-6).map(m=>({role:m.role,content:(m.content||"").replace(/^📝 /,"")}));
    apiMsgs.push({role:"user",content:"Continue the review article from exactly where it stopped. Do not repeat any earlier text or headings."});
    setBusy(true);
    if(user?.role!=="admin")bumpUsage();
    const ses=ls.get("adl-ses")||{};
    const sys=buildReviewSystem(lastReviewCfg,"full");
    const ts=new Date().toISOString();
    const reply=await chatRequest({messages:apiMsgs,systemPrompt:sys,maxTokens:3500,model:HEAVY_MODEL,username:ses.username||null,sessionToken:ses.sessionToken||null},
      partial=>setConvs(p=>({...p,scholar:[...base,{role:"assistant",content:partial,timestamp:ts}]})));
    const fin=[...base,{role:"assistant",content:reply,timestamp:new Date().toISOString()}];
    ls.set(key,fin.slice(-80));
    setConvs(p=>({...p,scholar:fin}));
    setBusy(false);
  },[lastReviewCfg,user]);

  const clearChat=()=>{setConvs(p=>({...p,[agent.id]:[]}));ls.del(user?`adl-m-${user.id}-${agent.id}`:`adl-gm-${agent.id}`);showT("Chat cleared");};
  const exportChat=()=>{
    if(!msgs.length){showT("Nothing to export.");return;}
    const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Adelani AI</title><style>body{font-family:Georgia,serif;max-width:720px;margin:40px auto;color:#1a1208;padding:24px}h1{font-size:26px;margin-bottom:4px}h2{font-size:12px;color:#999;letter-spacing:2px;text-transform:uppercase;font-weight:400;margin:4px 0 24px}.m{margin:12px 0;padding:13px 16px;border-radius:11px}.u{background:#f5f0e3;margin-left:60px}.a{background:#fff;border:1px solid #e0d8cc;margin-right:60px}.role{font-size:11px;font-weight:700;text-transform:uppercase;color:#999;margin-bottom:5px}.txt{font-size:14px;line-height:1.75;white-space:pre-wrap}.ts{font-size:10px;color:#ccc;margin-top:5px}</style></head><body><h1>Adelani AI</h1><h2>${agent.name} · ${agent.role}</h2>${msgs.map(m=>`<div class="m ${m.role==="user"?"u":"a"}"><div class="role">${m.role==="user"?"You":agent.name}</div><div class="txt">${(m.content||"").replace(/</g,"&lt;")}</div><div class="ts">${new Date(m.timestamp).toLocaleString()}</div></div>`).join("")}<p style="margin-top:32px;font-size:11px;color:#ccc;border-top:1px solid #eee;padding-top:16px">Adelani AI Chat · ${new Date().toLocaleString()}</p></body></html>`;
    const w=window.open("","_blank");if(w){w.document.write(html);w.document.close();setTimeout(()=>w.print(),400);}else showT("Allow popups to export.");

  /* ── ACCEPTED FILE TYPES ── */
  const ACCEPT=[
    "image/jpeg","image/png","image/gif","image/webp","image/svg+xml","image/tiff",
    "text/plain","text/csv",
    "application/pdf",
    "application/vnd.openxmlformats-officedocument.wordprocessingml.document","application/msword",
    "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet","application/vnd.ms-excel",
    "application/vnd.openxmlformats-officedocument.presentationml.presentation","application/vnd.ms-powerpoint",
    "application/vnd.oasis.opendocument.text",
    "audio/mpeg","audio/wav","audio/flac",
    "video/mp4","video/x-msvideo","video/quicktime","video/x-matroska",
    "application/zip","application/x-rar-compressed","application/x-7z-compressed",
    ".txt,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv,.odt,.jpg,.jpeg,.png,.gif,.svg,.webp,.tiff,.tif,.mp3,.wav,.flac,.mp4,.avi,.mov,.mkv,.zip,.rar,.7z,.iso,.exe"
  ].join(",");

  if(view==="loading") return(

      <div style={{width:32,height:32,border:"3px solid rgba(122,34,50,.2)",borderTopColor:"#7A2232",borderRadius:"50%",animation:"spin .9s linear infinite"}}/>

    {showDeckLimit&&<DeckLimitModal t={t} dark={dark} onClose={()=>setShowDeckLimit(false)}/>}
    {showWhatsNew&&<WhatsNewModal t={t} dark={dark} onClose={()=>{ls.set(WHATS_NEW_KEY,true);setShowWhatsNew(false);}}/>}
    {showReview&&<ReviewModal t={t} dark={dark} isRegistered={!!user&&!isGuest} onClose={()=>setShowReview(false)} onGenerate={genReview}/>}

    <div style={{position:"fixed",top:"-25%",left:"-20%",width:"70%",height:"70%",borderRadius:"50%",background:`radial-gradient(circle,${agent.color}0A,transparent 70%)`,pointerEvents:"none",zIndex:0,animation:"orb1 14s ease-in-out infinite"}}/>

    <div style={{display:"flex",height:"100%",position:"relative",overflow:"hidden"}}>
      {!mobile&&(
        <div style={{width:sideOpen?258:0,minWidth:sideOpen?258:0,transition:"width .3s ease,min-width .3s ease",overflow:"hidden",borderRight:`1px solid ${t.border}`,flexShrink:0,zIndex:10}}>
          <div style={{width:258,height:"100%"}}>
            <Sidebar t={t} dark={dark} agent={agent} agents={AGENTS} user={user} isGuest={isGuest} onSwitch={switchAgent} onAdmin={()=>setView("admin")} onLogout={logout}/>

        {/* Header */}
        <div style={{height:62,padding:`0 ${mobile?"12px":"20px"}`,display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:`3px double ${t.border}`,background:t.surf,flexShrink:0,zIndex:5}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <button onPointerDown={()=>setSide(o=>!o)} style={{width:36,height:36,borderRadius:9,background:t.inp,border:`1px solid ${t.border}`,color:t.muted,fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>{sideOpen?(mobile?"✕":"←"):"☰"}</button>
            {mobile
              ?<div style={{fontFamily:DISPLAY,fontWeight:700,fontSize:22,color:t.text}}>Adelani <span style={{color:t.gold}}>AI</span></div>
              :<><Emblem icon={agent.icon} back={agent.name[0]} color={agent.color} size={38} mode="flip"/>
                <div><div style={{fontFamily:DISPLAY,fontWeight:700,fontSize:22,lineHeight:1.05,color:t.text}}>{agent.name}</div><div style={{fontSize:12.5,color:t.muted,fontStyle:"italic"}}>{agent.role}</div></div>
                {agent.web&&<span style={{padding:"2px 8px",borderRadius:20,background:`${agent.color}12`,border:`1px solid ${agent.color}26`,fontSize:9.5,color:agent.color,fontWeight:700}}>● LIVE</span>}
              </>}
          </div>
          <div style={{display:"flex",gap:5,alignItems:"center"}}>
            {!mobile&&<>{AGENTS.map((a,i)=><button key={a.id} onPointerDown={()=>setAgent(a)} title={a.name} style={{width:32,height:32,borderRadius:"50%",padding:0,background:"transparent",border:"none",outline:agent.id===a.id?`1.5px solid ${t.gold}`:"none",outlineOffset:2,opacity:agent.id===a.id?1:.85,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}><Emblem icon={a.icon} back={a.name[0]} color={a.color} size={26} mode="sway" delay={-i*0.6}/></button>)}
            <div style={{width:1,height:20,background:t.border,margin:"0 2px"}}/></>}
            <button onPointerDown={toggleTheme} style={{width:36,height:36,borderRadius:9,background:t.inp,border:`1px solid ${t.border}`,fontSize:15,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>{dark?"☀️":"🌙"}</button>
            {agent.id==="scholar"&&<button onPointerDown={()=>setShowReview(true)} title="Review Article Engine" style={{height:36,padding:"0 11px",borderRadius:9,background:"linear-gradient(135deg,#7A2232,#561520)",border:"none",color:"#FFF",fontSize:13,fontWeight:700,fontFamily:"'EB Garamond','Times New Roman',serif",cursor:"pointer",display:"flex",alignItems:"center",gap:5}}>◈{mobile?"":" Review"}</button>}
            {agent.id==="scholar"&&lastReviewCfg&&!!user&&!isGuest&&<button onPointerDown={continueReview} title="Continue the article" style={{height:36,padding:"0 11px",borderRadius:9,background:t.inp,border:`1px solid ${t.border}`,color:t.text,fontSize:13,cursor:"pointer",display:"flex",alignItems:"center",gap:4}}>⏭{mobile?"":" Continue"}</button>}
            <button onPointerDown={exportChat} style={{width:36,height:36,borderRadius:9,background:t.inp,border:`1px solid ${t.border}`,fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",color:t.muted,cursor:"pointer"}}>📄</button>
            {!mobile&&<button onPointerDown={clearChat} style={{height:36,padding:"0 12px",borderRadius:9,background:t.inp,border:`1px solid ${t.border}`,color:t.muted,fontSize:13,cursor:"pointer"}}>Clear</button>}
          </div>
        </div>

        {/* Mobile agent strip */}
        {mobile&&(
          <div style={{padding:"6px 10px",borderBottom:`1px solid ${t.border}`,background:t.surf,display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
            <Emblem icon={agent.icon} back={agent.name[0]} color={agent.color} size={22} mode="flip"/>
            <span style={{fontFamily:"'EB Garamond','Times New Roman',serif",fontWeight:600,fontSize:13,color:agent.color}}>{agent.name}</span>
            <span style={{fontSize:12,color:t.muted,flex:1}}>· {agent.role}</span>
            {agent.web&&<span style={{fontSize:9.5,color:agent.color,fontWeight:700}}>LIVE</span>}
            <button onPointerDown={clearChat} style={{background:"transparent",border:`1px solid ${t.border}`,borderRadius:6,padding:"3px 9px",color:t.muted,fontSize:11.5,cursor:"pointer"}}>Clear</button>
          </div>
        )}

        {/* Messages */}
        <div style={{flex:1,overflowY:"auto",padding:mobile?"14px 13px 8px":"20px 24px 8px",display:"flex",flexDirection:"column"}}>
          {msgs.length===0&&(
            <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",textAlign:"center",padding:"28px 18px",animation:"fadeUp .5s ease"}}>
              <div style={{marginBottom:24}}><Emblem key={agent.id} icon={agent.icon} back={agent.name[0]} color={agent.color} size={92} mode="flip" ring={6} ringBg={t.bg} float/></div>
              <div style={{fontFamily:DISPLAY,fontSize:mobile?32:40,fontWeight:600,lineHeight:1.1,color:t.text,marginBottom:6}}>Hello, I'm <em style={{color:agent.color}}>{agent.name}</em></div>
              <div style={{color:t.gold,fontSize:15,letterSpacing:"6px",margin:"2px 0 8px"}}>— ❦ —</div>
              <div style={{fontSize:16.5,color:t.muted,maxWidth:360,lineHeight:1.6,marginBottom:14,fontStyle:"italic"}}>{agent.role} · Powered by Adelani AI</div>
              <div style={{fontSize:14,color:t.muted,marginBottom:22,padding:"6px 16px",borderRadius:4,background:t.card,border:`1px solid ${t.border}`}}>
                📎 Supports: PDF, Word, Excel, PowerPoint, CSV, images & more
              </div>
              {agent.design&&<div style={{fontSize:14.5,color:t.text,marginTop:-10,marginBottom:20,padding:"7px 16px",borderRadius:4,background:t.card,border:`1px solid ${t.gold}66`}}>
                ✦ Grace Studio Pro · {decksLeft===null?"Unlimited presentations":`${decksLeft} of ${FREE_DECKS} free presentations left today`}
              </div>}
              <div style={{display:"flex",flexWrap:"wrap",gap:7,justifyContent:"center",maxWidth:430}}>
                {[
                  agent.id==="asha"?"What can you help me with?":null,

                ].filter(Boolean).slice(0,4).map(p=>(
                  <button key={p} onPointerDown={()=>{setInput(p);taRef.current?.focus();}} style={{padding:"9px 16px",borderRadius:4,background:t.card,border:`1px solid ${t.border}`,borderBottom:`2px solid ${agent.color}66`,color:t.text,fontSize:15,fontStyle:"italic",cursor:"pointer"}}>{p}</button>
                ))}
              </div>

          )}
          {msgs.map((m,i)=><Bubble key={i} msg={m} agent={agent} t={t} dark={dark} live={i===msgs.length-1}/>)}
          {busy&&!(msgs.length&&msgs[msgs.length-1].role==="assistant"&&msgs[msgs.length-1].content)&&(
            <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:14,animation:"fadeUp .3s ease"}}>
              <Emblem icon={agent.icon} back={agent.name[0]} color={agent.color} size={34} mode="spin"/>

                <Emblem icon={a.icon} back={a.name[0]} color={a.color} size={24} mode={agent.id===a.id?"flip":"sway"} delay={-i*0.6}/>
                <span style={{fontSize:10,fontFamily:"'EB Garamond','Times New Roman',serif",fontWeight:600,color:agent.id===a.id?a.color:t.muted,whiteSpace:"nowrap"}}>{a.name}</span>
              </button>

          </div>
        )}

        {/* Input area */}
        <div style={{padding:`7px ${mobile?"10px":"16px"} max(12px,env(safe-area-inset-bottom))`,background:t.surf,borderTop:`1px solid ${t.border}`,flexShrink:0,position:"relative",zIndex:10}}>

          {/* Attachment preview */}
          {(attachment||processing)&&(
            <div style={{marginBottom:8,display:"flex",alignItems:"center",gap:8}}>

                ? <div style={{display:"flex",alignItems:"center",gap:8,padding:"7px 12px",borderRadius:10,background:t.inp,border:`1px solid ${t.border}`}}>

                    }
                    <button onPointerDown={()=>setAttachment(null)} style={{position:"absolute",top:-7,right:-7,width:18,height:18,borderRadius:"50%",background:"#666",color:"#fff",fontSize:10,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>✕</button>

          <div style={{display:"flex",alignItems:"flex-end",gap:8,background:t.card,borderRadius:8,border:`1px solid ${input||attachment?t.gold:t.border}`,padding:"9px 10px",maxWidth:880,margin:"0 auto",transition:"border .2s,box-shadow .2s",boxShadow:input||attachment?`0 0 0 3px ${t.gold}22`:(dark?"none":"0 2px 10px rgba(60,40,10,.05)")}}>

            {/* Attachment button */}

              style={{width:35,height:35,borderRadius:9,flexShrink:0,background:attachment?`${agent.color}14`:t.card,border:`1px solid ${attachment?agent.color+"40":t.border}`,color:attachment?agent.color:t.muted,fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>

              onInput={e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,130)+"px";}}/>

            {/* Send button */}
            <button type="button" onPointerDown={send}
              style={{width:38,height:38,borderRadius:"50%",flexShrink:0,
                background:agent.color,
                border:`1px solid ${t.gold}`,color:"#FFFBF2",fontSize:18,
                display:"flex",alignItems:"center",justifyContent:"center",
                cursor:"pointer",
                opacity:(busy||(!input.trim()&&!attachment))?.4:1,
                boxShadow:`0 3px 14px ${agent.color}30`,
                transition:"opacity .15s"}}>
              {busy?<Spinner size={15}/>:"↑"}
            </button>
          </div>

          {!mobile&&(
            <div style={{textAlign:"center",fontSize:12,color:t.muted,marginTop:7,opacity:.8,fontStyle:"italic",letterSpacing:".3px"}}>
              Adelani AI · Seven agents · PDF · Word · Excel · PowerPoint · CSV · Images · Voice
            </div>
          )}
        </div>
      </div>
    </div>

    {toast&&<div style={{position:"fixed",bottom:mobile?88:20,left:"50%",transform:"translateX(-50%)",background:t.card,border:`1px solid ${t.border}`,borderRadius:10,padding:"9px 18px",fontSize:13.5,color:t.text,boxShadow:"0 6px 24px rgba(0,0,0,.15)",zIndex:400,whiteSpace:"nowrap",animation:"fadeUp .3s ease"}}>{toast}</div>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
/* Tell the safety-net watchdog the app started successfully */
(function(){
  var r = document.getElementById("root");
  if(r) r.setAttribute("data-mounted","1");
  if(window.__adelaniWatchdog) clearTimeout(window.__adelaniWatchdog);
})();
</script>
<!-- ══════════ FAST START: compile the app once, then reuse it ══════════
     The app above is written in JSX, which browsers can't run directly. Compiling it
     needs Babel (3 MB). We compile once, keep the result in this browser, and only
     download Babel again when the app code changes. Edit the code above as usual. -->
<script>
(function(){
  var src=document.getElementById("app-src").textContent;
  var h=0;for(var i=0;i<src.length;i++){h=(h*31+src.charCodeAt(i))|0;}
  var key="adl-jsx-"+(h>>>0).toString(36)+"-"+src.length;
  function run(code){var s=document.createElement("script");s.text=code;document.body.appendChild(s);}
  var cached=null;
  try{cached=localStorage.getItem(key);}catch(e){}
  if(cached){run(cached);return;}
  window.__adelaniNeedsBabel=true;
  var b=document.createElement("script");
  b.src="./vendor/babel.min.js";
  b.onload=function(){
    var out=Babel.transform(src,{presets:["react"]}).code;
    try{
      for(var k=localStorage.length-1;k>=0;k--){var n=localStorage.key(k);if(n&&n.indexOf("adl-jsx-")===0)localStorage.removeItem(n);}
      localStorage.setItem(key,out);
    }catch(e){}
    run(out);
  };
  document.head.appendChild(b);
})();
</script>
